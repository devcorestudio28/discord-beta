<!doctype html><html lang="hr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Chatter postavljanje</title><style>*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top left,#6673ef,#313338 48%);color:#fff;font-family:Segoe UI,sans-serif}.card{width:min(460px,90vw);background:#2b2d31;padding:34px;border-radius:12px;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px;font-size:30px}p{color:#b5bac1;line-height:1.5}label{font-size:12px;color:#b5bac1;font-weight:700}input{width:100%;height:44px;margin:8px 0 12px;padding:0 12px;background:#1e1f22;border:1px solid #444;color:white;border-radius:4px;outline:none}button{width:100%;height:44px;background:#5865f2;color:#fff;border:0;border-radius:4px;font-weight:700;cursor:pointer}.error{min-height:20px;color:#fa777c;font-size:12px}</style></head><body><form class="card" id="form"><h1>Dobro došao u Chatter</h1><p>Za povezivanje desktop aplikacije unesi javnu adresu svoje Railway aplikacije. Ovo je potrebno samo prvi put.</p><label>RAILWAY ADRESA<input id="url" type="url" placeholder="https://tvoja-aplikacija.up.railway.app" required></label><div class="error" id="error"></div><button>Poveži aplikaciju</button></form><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const result=await window.chatterDesktop.saveServerUrl(document.getElementById('url').value);if(!result.ok)document.getElementById('error').textContent=result.error});</script></body></html>
